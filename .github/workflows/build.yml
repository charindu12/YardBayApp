name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore YardBayApp.csproj

      - name: Build APK (Release)
        run: dotnet publish YardBayApp.csproj -f net8.0-android -c Release -o out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YardBayApp-apk
          path: out/*.apk
